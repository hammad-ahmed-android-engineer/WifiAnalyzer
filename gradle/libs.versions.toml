[versions]
kotlin = "2.4.21"
hilt = "2.60.1"
hiltNavigationCompose = "1.2.0"
appcompat = "1.8.0"
commonsLang3 = "3.21.0"
coreKtx = "1.19.1"
coreSplashscreen = "1.2.0"
espressoCore = "3.7.0"
junit = "4.13.2"
junitVersion = "1.3.0"
material = "1.14.0"

composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycleCompose = "2.11.0"
navigationCompose = "2.10.2"

sdp = "1.1.1"
ssp = "1.1.1"
zxing = "3.5.4"
camerax = "1.6.2"
mlkitBarcode = "17.3.0"

[libraries]
coreKtx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
coreSplashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
commonsLang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commonsLang3" }

composeBom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
composeUi = { module = "androidx.compose.ui:ui" }
composeUiGraphics = { module = "androidx.compose.ui:ui-graphics" }
composeUiToolingPreview = { module = "androidx.compose.ui:ui-tooling-preview" }
composeUiTooling = { module = "androidx.compose.ui:ui-tooling" }
composeMaterial3 = { module = "androidx.compose.material3:material3" }
composeMaterialIconsExtended = { module = "androidx.compose.material:material-icons-extended" }

activityCompose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycleViewModelCompose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleCompose" }
lifecycleRuntimeCompose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleCompose" }
navigationCompose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

sdpAndroid = { module = "com.intuit.sdp:sdp-android", version.ref = "sdp" }
sspAndroid = { module = "com.intuit.ssp:ssp-android", version.ref = "ssp" }

zxingCore = { module = "com.google.zxing:core", version.ref = "zxing" }

cameraxCore = { module = "androidx.camera:camera-core", version.ref = "camerax" }
cameraxCamera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
cameraxLifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
cameraxView = { module = "androidx.camera:camera-view", version.ref = "camerax" }
mlkitBarcodeScanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkitBarcode" }

junit = { module = "junit:junit", version.ref = "junit" }
extJunit = { module = "androidx.test.ext:junit", version.ref = "junitVersion" }
espressoCore = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }

[plugins]
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
